<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Francis Telecom — Applications</title>
  <style>
    :root { --bg: #f5f4f0; --surface: #fff; --text: #1e1e1a; --muted: #6d6a62; --line: #e4e1d9; }
    @media (prefers-color-scheme: dark) { :root { --bg: #141412; --surface: #1f1f1c; --text: #eeece6; --muted: #a3a097; --line: #33322d; color-scheme: dark; } }
    body { margin: 0; font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; background: var(--bg); color: var(--text); }
    main { max-width: 560px; margin: 0 auto; padding: 32px 16px; }
    h1 { font-size: 1.4rem; margin: 0 0 4px; }
    p { color: var(--muted); margin: 0 0 24px; }
    a { display: flex; gap: 14px; align-items: center; background: var(--surface); border: 1px solid var(--line); border-radius: 16px; padding: 16px; margin-bottom: 12px; color: inherit; text-decoration: none; }
    a img { width: 52px; height: 52px; }
    a b { display: block; font-size: 1.1rem; }
    a span { color: var(--muted); font-size: .92rem; }
  </style>
</head>
<body>
  <main>
    <h1>Francis Telecom</h1>
    <p>Applications de gestion pour commerces du Burkina Faso.</p>
    <a href="buvette/"><img src="buvette/icon.svg" alt=""><div><b>Ma Buvette</b><span>Stock réserve et frigo, ventes, Orange Money, dépenses, bénéfices</span></div></a>
    <a href="credit-boutique/"><img src="credit-boutique/icon.svg" alt=""><div><b>Crédit Boutique</b><span>Crédits clients, reliquats, rappels WhatsApp et SMS</span></div></a>
  </main>
</body>
</html>
